[project]
name = "mlstudies-code"
version = "0.1.0"
description = "ML Studies code - classical ML, PyTorch, LLM, and agents"
readme = "SUBJECTS.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agno>=3.1.8",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.3",
    "openai>=2.45.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = [".","./agents/agno"]
testpaths = ["tests"]

[project.optional-dependencies]
pytorch = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "torchmetrics>=1.9.0",
    "torchinfo>=1.8.0",
    "mlxtend>=0.25.0",
]

deep-learning = [
    "tensorflow>=2.16.0",
    "keras>=3.15.1",
]

anomaly = [
    "pyod>=3.6.6",
]

kaggle = [
    "kaggle>=2.2.4",
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
]


agents = [
    "agno>=3.1.8",
    "chromadb>=1.5.9",
    "arxiv>=4.0.1",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "pypdf>=6.19.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]




all = [
    "mlstudies-code[pytorch,deep-learning,anomaly,kaggle,agents]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ipython>=9.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
