[project]
name = "mlstudies-code"
version = "0.1.0"
description = "ML Studies code - classical ML, PyTorch, LLM, and agents"
readme = "SUBJECTS.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agno>=3.1.1",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "openai>=2.45.0",
]

[tool.pytest.ini_options]
pythonpath = [".","./agents/agno"]
testpaths = ["tests"]


dependencies = [
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "requests>=2.32.0",
    "httpx>=0.28.1",
    "agno>=3.1.0",
    "sqlalchemy>=2.1.0",
    "openai>=3.22.1",
    "ddgs>=9.16.0",
    "yfinance>=1.7.0",
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",
    "fastapi>=0.142.2",
]

[project.optional-dependencies]
pytorch = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "torchmetrics>=1.9.0",
    "torchinfo>=1.8.0",
    "mlxtend>=0.25.0",
]

deep-learning = [
    "tensorflow>=2.16.0",
    "keras>=3.15.1",
]

anomaly = [
    "pyod>=3.6.6",
]

kaggle = [
    "kaggle>=2.2.4",
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
]

llm = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langsmith>=0.14.2",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-llms-openai>=0.7.0,<0.8",
    "llama-index-embeddings-openai>=0.6.0,<0.7",
    "ollama>=0.6.3",
    "openai>=1.0.0",
    "huggingface-hub>=0.25.0,<2.0",
]

agents = [
    "mlstudies-code[llm]",
    "langgraph>=1.2.12",
    "agno>=3.1.0",
    "chromadb>=1.5.9",
    "arxiv>=4.0.1",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "google-genai>=2.26.0",
    "pypdf>=6.19.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

openai = [
    "mlstudies-code[llm]",
    "langchain-openai>=1.6.7",
    "langchainhub>=0.1.21",
    "beautifulsoup4>=4.15.0",
]

anthropic = [
    "mlstudies-code[llm]",
    "langchain-anthropic>=1.7.5",
    "anthropic>=1.11.0",
]

mistral = [
    "mlstudies-code[llm]",
    "mistralai>=3.0.0",
    "langchain-mistralai>=1.1.6",
]

cohere = [
    "mlstudies-code[llm]",
    "cohere>=5.18.0,<6.0",
    "langchain-cohere>=0.6.0",
]

gemini = [
    "mlstudies-code[llm]",
    "google-generativeai>=0.8.6",
    "langchain-google-genai>=4.4.0",
]

watsonx = [
    "mlstudies-code[llm]",
    "ibm-watsonx-ai>=1.8.0",
    "langchain-ibm>=1.1.1",
]

bedrock = [
    "mlstudies-code[llm]",
    "boto3>=1.43.106",
    "botocore>=1.43.106",
    "transformers>=5.18.0",
    "unstructured>=0.18.32",
    "langchain-experimental>=0.4.2",
]

rag = [
    "mlstudies-code[llm]",
    "langchain-chroma>=1.1.0",
    "faiss-cpu>=1.15.1",
    "sentence-transformers>=6.1.0",
    "pypdf>=6.19.0",
    "datasets>=5.0.1",
]

all = [
    "mlstudies-code[pytorch,deep-learning,anomaly,kaggle,llm,agents,rag,openai,anthropic,mistral,cohere,gemini,watsonx,bedrock]",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ipython>=9.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
